services:
  mail2obsidian:
    build: .
    container_name: mail2obsidian
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=${TZ:-Europe/Berlin}
    volumes:
      # Mount host rclone configuration directory (read-write so OAuth tokens can refresh)
      - ${RCLONE_CONFIG_DIR:-~/.config/rclone}:/root/.config/rclone
      # Staging / local output directory
      - ./inbox:/app/inbox
