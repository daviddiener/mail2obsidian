services:
  mail2obsidian:
    build: .
    container_name: mail2obsidian
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=${TZ:-Europe/Berlin}
    volumes:
      # Mount host rclone configuration (read-only)
      - ${RCLONE_CONFIG_PATH:-~/.config/rclone/rclone.conf}:/root/.config/rclone/rclone.conf:ro
      # Staging / local output directory
      - ./inbox:/app/inbox
